    <style>
      /* Pintado antes de qualquer JavaScript: a abertura aparece na hora. */
      html,

        position: fixed;

        display: grid;

        background: radial-gradient(120% 90% at 50% 110%, #16223a 0%, #070b14 55%, #04070d 100%);

      }
      .abertura-estatica h1 {
        margin: 0;
        font-weight: 400;
        font-size: clamp(2.6rem, 9vw, 5.5rem);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .abertura-estatica .datas {
        margin-top: 0.75rem;
        font-family: Fraunces, "Iowan Old Style", Georgia, serif;
        font-style: italic;
        font-size: clamp(1.2rem, 3.4vw, 1.9rem);
        color: #ffb547;

      .abertura-estatica p {
        margin: 1rem 0 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: clamp(0.95rem, 2.4vw, 1.15rem);
        color: #b3bccd;
